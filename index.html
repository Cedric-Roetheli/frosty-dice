<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A mobile-first companion for Frosty Dice, played together with physical dice.">
    <title>Frosty Dice</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Frosty Dice</h1>
        <p>Your game sheet at the table.</p>
      </header>

      <section class="board-sheet" aria-labelledby="board-heading">
        <div class="board-sheet__header">
          <h2 id="board-heading">Your board</h2>
          <span class="preview-label">Preview</span>
        </div>
        <table class="board" aria-labelledby="board-heading">
          <caption class="visually-hidden">
            Four columns, A through D, and seven rows, 1 through 7.
            A1 is the start. D7 is the goal. All cells are empty and unavailable
            in this preview.
          </caption>
          <thead id="board-columns"></thead>
          <tbody id="board-rows"></tbody>
        </table>
      </section>

      <p id="app-status" class="app-status" role="status">Loading board…</p>
      <noscript>
        <p>Enable JavaScript to display the board.</p>
      </noscript>
    </main>
  </body>
</html>
